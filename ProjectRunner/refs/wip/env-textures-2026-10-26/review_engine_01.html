<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runner environment texture review 01</title>
<style>
body{margin:0;font:14px/1.5 var(--font-sans,system-ui);color:var(--foreground,#eee)}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}button{font:inherit;padding:7px 12px;border:1px solid var(--border,#444);border-radius:7px;background:var(--secondary,#252525);color:inherit;cursor:pointer}
button[aria-pressed=true]{background:var(--primary,#ddd);color:var(--primary-foreground,#171717)}button:focus-visible{outline:2px solid var(--ring,#99baff);outline-offset:2px}
figure{margin:0}figure[hidden]{display:none}figure img{display:block;width:100%;height:auto;border-radius:8px}figcaption{margin:8px 0 14px;color:var(--muted-foreground,#bbb)}
details{border-top:1px solid var(--border,#444);padding-top:12px;margin-top:6px}summary{cursor:pointer}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}section img{width:100%;height:auto;border-radius:6px}section p{margin:5px 0;color:var(--muted-foreground,#bbb)}.note{color:var(--muted-foreground,#bbb);font-size:13px;margin:12px 0 0}
@media(max-width:460px){nav{gap:6px}button{padding:6px 9px}section{gap:7px}}
</style></head><body>
<nav aria-label="Review views">
<button data-view="neutral" aria-pressed="true">Both variants</button>
<button data-view="a" aria-pressed="false">A  restrained</button>
<button data-view="b" aria-pressed="false">B  worn</button>
<button data-view="night" aria-pressed="false">Night lighting</button>
</nav>
<figure id="neutral"><img alt="Two identical groups of kit meshes in Unreal, restrained wear on the left and stronger wear on the right" src="C:/Users/GameDevPC0403/Documents/GitHub/proj-docs/ProjectRunner/refs/wip/env-textures-2026-10-26/ue04/Neutral_Overview.png"><figcaption>Unreal Engine. A on the left, B on the right. Both use the same geometry, palette and greyscale shapes.</figcaption></figure>
<figure id="a" hidden><img alt="Close view of restrained painted metal, canvas, wood and wall materials on the kit meshes" src="C:/Users/GameDevPC0403/Documents/GitHub/proj-docs/ProjectRunner/refs/wip/env-textures-2026-10-26/ue04/Neutral_A_Close.png"><figcaption>A keeps the wear faint. Broad painted patches supply the colour variation.</figcaption></figure>
<figure id="b" hidden><img alt="Matching close view with more edge wear and wall colour variation" src="C:/Users/GameDevPC0403/Documents/GitHub/proj-docs/ProjectRunner/refs/wip/env-textures-2026-10-26/ue04/Neutral_B_Close.png"><figcaption>B adds pale chips around seams and stronger patches on the wall. The underlying shapes stay the same.</figcaption></figure>
<figure id="night" hidden><img alt="Both kit groups under matching warm and cool night lights" src="C:/Users/GameDevPC0403/Documents/GitHub/proj-docs/ProjectRunner/refs/wip/env-textures-2026-10-26/ue04/Night_Overview.png"><figcaption>The same two groups under matching night lights. Exposure is fixed. Signs remain text-free.</figcaption></figure>
<details><summary>Designer shapes and colour outputs</summary><section>
<div><img alt="Shared greyscale trim shapes" src="C:/Users/GameDevPC0403/Documents/GitHub/HoudiniSource/ProjectRunner/tex/environment_01/A_Restrained/T_Trim_H.png"><p>Shared greyscale shapes</p></div>
<div><img alt="Restrained trim base colour" src="C:/Users/GameDevPC0403/Documents/GitHub/HoudiniSource/ProjectRunner/tex/environment_01/A_Restrained/T_Trim_BC.png"><p>A  restrained colour</p></div>
<div><img alt="Worn trim base colour" src="C:/Users/GameDevPC0403/Documents/GitHub/HoudiniSource/ProjectRunner/tex/environment_01/B_Worn/T_Trim_BC.png"><p>B  worn colour</p></div>
</section></details>
<p class="note">First look review at 2K with smooth filtering. Pixel reduction comes after choosing the material look. Seven kit pieces per variant cover all 14 trim strips and the wall slot.</p>
<script>
document.querySelectorAll('button[data-view]').forEach(button=>button.addEventListener('click',()=>{
 document.querySelectorAll('button[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 document.querySelectorAll('body>figure').forEach(f=>f.hidden=f.id!==button.dataset.view);
}));
window.addEventListener('load',()=>console.log('Review images',JSON.stringify(Array.from(document.images).map(i=>({loaded:i.complete&&i.naturalWidth>0,width:i.naturalWidth})))));
</script></body></html>
